<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="늘봄" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Neulbom — 영유아 모니터링 PoC</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #video,
      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #video {
        z-index: 0;
        opacity: 0;
        pointer-events: none;
      }
      #canvas {
        z-index: 1;
      }
      #start {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 32px;
        font-size: 18px;
        font-weight: 600;
        background: #ffffff;
        color: #000;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        z-index: 2;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      #start[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      #start.hidden {
        display: none;
      }
      #mute {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.92);
        color: #000;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        z-index: 3;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        display: none;
      }
      #mute.visible {
        display: inline-block;
      }
      #mute.muted {
        background: rgba(60, 60, 60, 0.92);
        color: #fff;
      }
      #help {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.6;
        z-index: 2;
        text-align: center;
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <button id="start">Start Detection</button>
      <button id="mute" type="button">🔊 음성 ON</button>
      <div id="help">HTTPS or localhost required for camera access.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
