<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<section id="panel" class="panel" aria-label="Stroller hazard panel">
  <div class="panel-row">
    <span class="state" id="m-state">—</span>
    <span class="fps" id="m-fps">— FPS</span>
  </div>

  <div class="signals cols-2">
    <span><strong>Persons</strong><span id="m-count">—</span></span>
    <span><strong>Max area</strong><span id="m-area">—</span></span>
    <span><strong>Max growth</strong><span id="m-growth">—</span></span>
    <span><strong>Mode</strong>유모차 (Pose)</span>
  </div>

  <div class="controls">
    <button id="btn-mute" type="button">🔊 음성 ON</button>
    <button id="btn-vis" type="button">📐 시각화 ON</button>
    <button id="btn-tune" type="button" class="third">⚙ 파라미터</button>
    <button id="btn-switch" type="button" class="switch third">🚗 차량 모드 전환</button>
    <button id="btn-stop" type="button" class="stop third">⏹ 종료</button>
  </div>

  <div id="tune" class="tune">
    <div class="param-row">
      <div class="param-header">
        <span class="name">WARN 면적 임계값 (가까움 기준)</span>
        <span class="value" id="v-area-warn">—</span>
      </div>
      <input type="range" id="s-area-warn" min="0.005" max="0.10" step="0.001" />
    </div>

    <div class="param-row">
      <div class="param-header">
        <span class="name">DANGER 면적 임계값 (매우 가까움)</span>
        <span class="value" id="v-area-danger">—</span>
      </div>
      <input type="range" id="s-area-danger" min="0.01" max="0.20" step="0.005" />
    </div>

    <div class="param-row">
      <div class="param-header">
        <span class="name">WARN 증가율 임계값 (천천히 접근)</span>
        <span class="value" id="v-growth-warn">—</span>
      </div>
      <input type="range" id="s-growth-warn" min="10" max="200" step="5" />
    </div>

    <div class="param-row">
      <div class="param-header">
        <span class="name">DANGER 증가율 임계값 (빠르게 접근)</span>
        <span class="value" id="v-growth-danger">—</span>
      </div>
      <input type="range" id="s-growth-danger" min="20" max="300" step="5" />
    </div>

    <div class="param-row">
      <div class="param-header">
        <span class="name">WARN 지속 프레임</span>
        <span class="value" id="v-warn-frames">—</span>
      </div>
      <input type="range" id="s-warn-frames" min="1" max="60" step="1" />
    </div>

    <div class="param-row">
      <div class="param-header">
        <span class="name">DANGER 지속 프레임</span>
        <span class="value" id="v-danger-frames">—</span>
      </div>
      <input type="range" id="s-danger-frames" min="1" max="60" step="1" />
    </div>

    <div class="tune-actions">
      <button id="btn-reset" type="button">기본값 복원</button>
    </div>
  </div>
</section>
