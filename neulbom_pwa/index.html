<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="늘봄" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Neulbom — 영유아 통합 모니터링 PoC</title>
  </head>
  <body>
    <div id="root">
      <div id="chooser">
        <h1>늘봄</h1>
        <div class="sub">NEULBOM MONITORING PoC</div>
        <div class="lead">영유아 모니터링 허브의 통합 프로토타입입니다.</div>

        <button class="mode-card" id="mode-car" type="button">
          <span class="icon">🚗</span>
          <div class="title">차량 모드</div>
          <div class="desc">
            카시트 위 영유아의 <strong>졸음과 머리 꺾임</strong>을 감지해
            음성·시각 알람으로 알려드립니다.
          </div>
        </button>

        <button class="mode-card" id="mode-stroller" type="button">
          <span class="icon">🛒</span>
          <div class="title">유모차 모드</div>
          <div class="desc">
            유모차 뒤·옆으로 다가오는 <strong>사람을 감지</strong>해 접근
            속도에 따라 단계별로 알려드립니다.
          </div>
        </button>

        <div class="hint">
          모드 선택 후 카메라 권한 팝업이 뜨면 <strong>'허용'</strong>해주세요.<br />
          하단 패널에서 파라미터 조정 가능 · 모바일에선 후면 카메라가 자동 선택됩니다.
        </div>
      </div>

      <div id="error" class="error-overlay hidden">
        <h2>오류</h2>
        <p class="error-msg" id="error-msg">—</p>
        <button id="error-back" class="start-btn" type="button">← 모드 선택으로</button>
      </div>

      <div id="stage"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
